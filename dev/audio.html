<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Tallgrass: audio dev page</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: dark; --bg: #14100a; --panel: #1e1810; --line: #3a2f20; --ink: #efe3c9; --dim: #a8987a; --gold: #e8b24a; --green: #8fb36a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, 'Segoe UI', sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 18px 20px 40px; }
  h1 { font: 600 20px/1.2 Georgia, serif; margin: 0 0 2px; letter-spacing: 0.02em; }
  .sub { color: var(--dim); margin: 0 0 14px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  button { background: #2a2116; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; font: inherit; cursor: pointer; }
  button:hover { border-color: var(--gold); }
  button.primary { background: var(--gold); color: #1a1208; border-color: var(--gold); font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  h2 { font: 600 12px/1 system-ui; text-transform: uppercase; letter-spacing: 0.1em; color: var(--dim); margin: 0 0 10px; }
  .row { display: grid; grid-template-columns: 112px 1fr 112px; gap: 8px; align-items: center; margin: 5px 0; }
  .row label { color: var(--dim); }
  .row output { text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--gold); }
  select { background: #2a2116; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; }
  .btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .mix { display: grid; grid-template-columns: 80px 1fr 44px; gap: 8px; align-items: center; margin: 4px 0; }
  .track { height: 10px; background: #120e08; border-radius: 5px; overflow: hidden; border: 1px solid var(--line); }
  .fill { height: 100%; width: 0; background: var(--green); }
  .meter .fill { background: var(--gold); }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  td, th { text-align: left; padding: 2px 8px 2px 0; color: var(--dim); font-weight: normal; }
  td.v { color: var(--ink); }
  #status { color: var(--dim); }
  #status b { color: var(--ink); font-weight: 600; }
  #log { max-height: 130px; overflow: auto; font: 12px/1.5 ui-monospace, Consolas, monospace; color: var(--dim); }
</style>
</head>
<body>
<main>
  <h1>Tallgrass audio director</h1>
  <p class="sub">No 3D scene here. Drive the world state with the sliders, fire sim events, listen. Audio starts on the first click.</p>
  <div class="bar">
    <button id="start" class="primary">Start audio</button>
    <label><input type="checkbox" id="mute" /> mute</label>
    <label>Preset
      <select id="preset"></select>
    </label>
    <label><input type="checkbox" id="advance" /> advance time (1 day per minute)</label>
    <span id="status"></span>
  </div>
  <div class="grid">
    <section><h2>World</h2><div id="world"></div></section>
    <section><h2>Camera and neighbours</h2><div id="cam"></div></section>
    <section>
      <h2>Sim events</h2>
      <div class="btns" id="events"></div>
      <div class="row" style="margin-top:10px"><label>Event distance</label><input id="dist" type="range" min="0" max="700" step="10" value="150" /><output id="distOut">150 m</output></div>
      <h2 style="margin-top:14px">Master</h2>
      <div class="row"><label>Volume</label><input id="vol" type="range" min="0" max="1" step="0.01" value="1" /><output id="volOut">1.00</output></div>
      <div class="mix meter"><span>Level</span><div class="track"><div class="fill" id="meterFill"></div></div><span id="meterDb">-inf</span></div>
    </section>
    <section><h2>Bed mix (targets)</h2><div id="beds"></div></section>
    <section><h2>Decoded files</h2><table id="decoded"></table></section>
    <section><h2>Log</h2><div id="log"></div></section>
  </div>
</main>
<script type="module" src="./audio.ts"></script>
</body>
</html>
